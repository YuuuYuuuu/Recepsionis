name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Self-hosted runner di VPS — tidak perlu SSH inbound dari GitHub (port 22 sering diblokir untuk IP datacenter).
    runs-on: [self-hosted, recepsionis]
    steps:
      - name: Deploy di VPS
        run: bash scripts/deploy.sh
        env:
          RECEPSIONIS_ROOT: /www/wwwroot/Recepsionis
